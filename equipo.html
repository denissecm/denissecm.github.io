<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Equipo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
        }
        .equipo {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .miembro {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            background-color: white;
            text-align: center;
            width: 250px;
        }
        .miembro img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        nav {
            margin: 20px 0;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #2196F3;
        }
    </style>
</head>
<body>
    <h1>🌟 Nuestro Equipo 🌟</h1>
    <nav>
        <a href="/">Inicio</a>
        <a href="/mascotas">Mascotas</a>
        <a href="/adoptantes">Adoptantes</a>
    </nav>
    <div class="equipo">
        <div class="miembro">
            <img src="https://via.placeholder.com/150" alt="Foto de perfil">
            <h3>María González</h3>
            <p><strong>Cualidad:</strong> Empatía y dedicación para encontrar hogares amorosos para cada mascota</p>
        </div>
        <div class="miembro">
            <img src="https://via.placeholder.com/150" alt="Foto de perfil">
            <h3>Juan Rodríguez</h3>
            <p><strong>Cualidad:</strong> Creatividad e innovación para mejorar la experiencia de adopción</p>
        </div>
    </div>
</body>
</html>
