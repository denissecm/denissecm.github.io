<html>
    <body>

        <button id="perro">
            dog
        </button>

        <button id="info">
            imagen
        </button>

        <div class="imagen" id="imagen">
        </div>

        <button id="votar">
            votar
        </button>

        <script>

            let imagenPerro;

            document.addEventListener("DOMContentLoaded", function() {
                imagenPerro = document.getElementById("imagen");
                document.getElementById("perro").addEventListener("click", () => obtenerJSON());
                document.getElementById("info").addEventListener("click", () => obtenerImagen());
            });  

            async function obtenerJSON() {
            try {
                    const respuesta = await fetch("https://api.thedogapi.com/v1/breeds?limit=1",      {
                    method: "GET", 
                    headers: {
                        "x-api-key": "live_IbfiPNiASmHiJJSPzjkjHGAmpJtG0VBHVfpemjHVVyd75HjO27P2WMCnDgVVDWeT"
                    }
            });
                if (!respuesta.ok) {
                    console.log("Error");
                }
                const data = await respuesta.json();
                console.log(data);
            } catch (error) {
                console.error("Error:", error.message);
            }
            }

            async function obtenerImagen() {
            const respuesta = await fetch(`https://api.thedogapi.com/v1/images/search?limit=1`);  
            const datos = await respuesta.json();
            console.log(datos);
            const urlImagen = datos[0].url;

                const imagenMascota= document.createElement('img');
                imagenMascota.src = urlImagen;
                imagenMascota.width = 300;
                imagenPerro.appendChild(imagenMascota);
            }

        </script>


        <style>
            button{
                font-size: medium;
                align-items: center;
                width: 100px;
                height: 40px;
                background-color: rgb(78, 78, 220);
                color: white;
            }

            button:hover{
                background-color: rgb(29, 29, 145);
            }

            .imagen{
                display: flex;
                margin-top: 40px;
                margin-bottom: 20px;
            }

            #votar{
                background-color: rgb(113, 176, 96);
            }

            #votar:hover{
                background-color: rgb(56, 88, 47);
            }
        </style>
        
    </body>


</html>
